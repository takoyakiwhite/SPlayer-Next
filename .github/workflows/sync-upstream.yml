name: Sync upstream

on:
  workflow_dispatch:
  push:
    branches:
      - sync-upstream-run
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout downstream repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/SPlayer-Dev/SPlayer-Next.git

      - name: Fetch upstream
        run: git fetch upstream dev

      - name: Sync upstream and preserve downstream changes
        shell: bash
        run: |
          set -e

          if git merge-base --is-ancestor upstream/dev HEAD; then
            echo "Upstream is already included; nothing to do."
            exit 0
          fi

          set +e
          git merge --no-ff --no-edit upstream/dev
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            echo "Upstream merged cleanly."
          else
            echo "Upstream merge has conflicts. Preserving downstream (ours) for conflicted files."
            conflicts="$(git diff --name-only --diff-filter=U)"

            if [ -z "$conflicts" ]; then
              echo "Merge failed without detectable conflict files. Aborting."
              git merge --abort || true
              exit "$status"
            fi

            echo "Conflicted files:"
            printf '%s\n' "$conflicts"

            while IFS= read -r file; do
              [ -z "$file" ] && continue
              git checkout --ours -- "$file"
              git add -- "$file"
            done <<< "$conflicts"
          fi

          # Keep the downstream repository's workflow files. This avoids
          # requiring workflow-write permission when upstream changes CI files.
          git checkout HEAD -- .github/workflows
          git add .github/workflows

          if git diff --cached --quiet; then
            echo "No upstream changes to commit."
            exit 0
          fi

          git commit -m "chore: sync upstream dev (preserve downstream workflows)"
          git push origin dev
