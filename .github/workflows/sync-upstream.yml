name: Sync upstream

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout downstream repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/SPlayer-Dev/SPlayer-Next.git

      - name: Fetch upstream
        run: git fetch upstream dev

      - name: Sync upstream and preserve downstream changes
        shell: bash
        run: |
          set -e

          if git merge-base --is-ancestor upstream/dev HEAD; then
            echo "Upstream is already included; nothing to do."
            exit 0
          fi

          set +e
          git merge --no-ff --no-edit upstream/dev
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            echo "Upstream merged cleanly."
            git push origin dev
            exit 0
          fi

          echo "Upstream merge has conflicts. Preserving downstream (ours) for every conflicted file."
          conflicts="$(git diff --name-only --diff-filter=U)"

          if [ -z "$conflicts" ]; then
            echo "Merge failed without detectable conflict files. Aborting."
            git merge --abort || true
            exit "$status"
          fi

          echo "Conflicted files:"
          printf '%s\n' "$conflicts"

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            git checkout --ours -- "$file"
            git add -- "$file"
          done <<< "$conflicts"

          git commit -m "chore: sync upstream dev (preserve downstream changes)"
          git push origin dev
