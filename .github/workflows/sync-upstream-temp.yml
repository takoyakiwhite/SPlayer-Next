name: Temporary upstream sync

on:
  push:
    branches:
      - sync-upstream-20260817

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: sync-upstream-20260817
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/SPlayer-Dev/SPlayer-Next.git
          git fetch upstream dev
          git merge upstream/dev --no-edit --no-ff --no-commit
          git checkout HEAD -- .github/workflows/dev.yml .github/workflows/release.yml
          git add .github/workflows/dev.yml .github/workflows/release.yml
          if git diff --name-only --diff-filter=U | grep -q .; then exit 1; fi
          git commit -m "sync: merge latest upstream dev"
          git push origin HEAD:sync-upstream-20260817
